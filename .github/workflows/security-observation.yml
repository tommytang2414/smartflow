name: Security Observation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-observation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    name: Non-blocking security observation
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve observation range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            HEAD_SHA="$(git rev-parse HEAD)"
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          mkdir -p evidence
          printf 'base_sha=%s\nhead_sha=%s\n' "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Secret diff with pinned Gitleaks
        id: gitleaks
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
          HEAD_SHA: ${{ steps.range.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$ARCHIVE" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $ARCHIVE" | sha256sum --check
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact=100 \
            --report-format=sarif \
            --report-path=evidence/gitleaks.sarif \
            --exit-code=0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install application dependencies
        id: app-dependencies
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install pinned observation tools
        id: observation-tools
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check semgrep==1.175.0 pip-audit==2.10.1

      - name: Changed-code SAST
        id: semgrep
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
        run: >-
          semgrep scan --config .github/security/semgrep.yml
          --baseline-commit "$BASE_SHA" --sarif --output evidence/semgrep.sarif
          --metrics=off

      - name: Dependency observation
        id: dependency
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
        shell: bash
        run: |
          set +e
          git diff --name-only "${BASE_SHA}...HEAD" -- requirements.txt 'requirements*.lock' pyproject.toml \
            > evidence/dependency-files.txt
          pip-audit -r requirements.txt --format json --output evidence/dependency-audit.json
          AUDIT_EXIT=$?
          printf '{"audit_exit_code":%s,"declarations_changed":%s,"boundary":"UNLOCKED_SOURCE_TARGET"}\n' \
            "$AUDIT_EXIT" "$(test -s evidence/dependency-files.txt && echo true || echo false)" \
            > evidence/dependency-changes.json
          exit 0

      - name: Existing tests and compile validation
        id: build-test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee evidence/tests.log
          TESTS=${PIPESTATUS[0]}
          python -m compileall -q smartflow ops tests 2>&1 | tee evidence/compileall.log
          COMPILE=${PIPESTATUS[0]}
          printf '{"tests_exit_code":%s,"compileall_exit_code":%s}\n' \
            "$TESTS" "$COMPILE" > evidence/build-test.json
          if [[ "$TESTS" -ne 0 || "$COMPILE" -ne 0 ]]; then
            echo "::warning::Existing tests/compile validation did not fully pass; see artifact."
          fi
          exit 0

      - name: Finalize portable evidence
        if: always()
        env:
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
          HEAD_SHA: ${{ steps.range.outputs.head_sha }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          APP_DEPENDENCIES_OUTCOME: ${{ steps.app-dependencies.outcome }}
          OBSERVATION_TOOLS_OUTCOME: ${{ steps.observation-tools.outcome }}
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
          BUILD_TEST_OUTCOME: ${{ steps.build-test.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path("evidence")
          evidence.mkdir(exist_ok=True)
          metadata = {
              "schema_version": 1,
              "mode": "NON_BLOCKING_OBSERVATION",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "base_sha": os.environ.get("BASE_SHA", ""),
              "head_sha": os.environ.get("HEAD_SHA", ""),
              "dependency_boundary": "UNLOCKED_SOURCE_TARGET_NOT_PRODUCTION_PARITY",
              "outcomes": {
                  "gitleaks": os.environ.get("GITLEAKS_OUTCOME", "unknown"),
                  "application_dependencies": os.environ.get("APP_DEPENDENCIES_OUTCOME", "unknown"),
                  "observation_tools": os.environ.get("OBSERVATION_TOOLS_OUTCOME", "unknown"),
                  "semgrep": os.environ.get("SEMGREP_OUTCOME", "unknown"),
                  "dependency": os.environ.get("DEPENDENCY_OUTCOME", "unknown"),
                  "build_test": os.environ.get("BUILD_TEST_OUTCOME", "unknown"),
              },
          }
          (evidence / "metadata.json").write_text(
              json.dumps(metadata, indent=2) + "\n", encoding="utf-8"
          )
          empty_sarif = {"version": "2.1.0", "$schema": "https://json.schemastore.org/sarif-2.1.0.json", "runs": []}
          for name in ("gitleaks.sarif", "semgrep.sarif"):
              path = evidence / name
              if not path.exists():
                  path.write_text(json.dumps(empty_sarif) + "\n", encoding="utf-8")
          dependency = evidence / "dependency-audit.json"
          if not dependency.exists():
              dependency.write_text("[]\n", encoding="utf-8")
          PY
          find evidence -maxdepth 1 -type f ! -name sha256sums.txt -print0 \
            | sort -z | xargs -0 sha256sum > evidence/sha256sums.txt

      - name: Upload observation evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: security-observation-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
