name: Security Observation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-observation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    name: Non-blocking security observation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout pull-request head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve observation range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            HEAD_SHA="$(git rev-parse HEAD)"
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          mkdir -p evidence
          printf 'base_sha=%s\nhead_sha=%s\n' "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Secret diff with pinned Gitleaks
        id: gitleaks
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
          HEAD_SHA: ${{ steps.range.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$ARCHIVE" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $ARCHIVE" | sha256sum --check
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact=100 \
            --report-format=sarif \
            --report-path=evidence/gitleaks.sarif \
            --config=.github/security/gitleaks.toml \
            --exit-code=0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install application dependencies
        id: app-dependencies
        continue-on-error: true
        run: |
          echo "APP_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install pinned observation tools
        id: observation-tools
        continue-on-error: true
        run: |
          python -m venv "$RUNNER_TEMP/observation-tools"
          "$RUNNER_TEMP/observation-tools/bin/pip" install --disable-pip-version-check semgrep==1.175.0 pip-audit==2.10.1
          echo "$RUNNER_TEMP/observation-tools/bin" >> "$GITHUB_PATH"

      - name: Changed-code SAST
        id: semgrep
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
        run: >-
          semgrep scan --config .github/security/semgrep.yml
          --baseline-commit "$BASE_SHA" --sarif --output evidence/semgrep.sarif
          --metrics=off

      - name: Base/head dependency observation
        id: dependency
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
          HEAD_SHA: ${{ steps.range.outputs.head_sha }}
        run: python .github/security/observe.py dependency --kind pip --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Evidence classifier regression tests
        run: python -m unittest discover -s .github/security -p 'test_*.py' -v

      - name: Known-positive effectiveness checks
        id: effectiveness
        continue-on-error: true
        env:
          GITLEAKS_BINARY: ${{ runner.temp }}/gitleaks
        run: python .github/security/effectiveness.py --kind pip

      - name: Existing tests and compile validation
        id: build-test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          "$APP_PYTHON" -m unittest discover -s tests -v 2>&1 | tee evidence/tests.log
          TESTS=${PIPESTATUS[0]}
          "$APP_PYTHON" -m compileall -q smartflow ops tests 2>&1 | tee evidence/compileall.log
          COMPILE=${PIPESTATUS[0]}
          printf '{"tests_exit_code":%s,"compileall_exit_code":%s}\n' \
            "$TESTS" "$COMPILE" > evidence/build-test.json
          if [[ "$TESTS" -ne 0 || "$COMPILE" -ne 0 ]]; then
            echo "::warning::Existing tests/compile validation did not fully pass; see artifact."
          fi
          exit 0

      - name: Finalize portable evidence
        if: always()
        env:
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
          HEAD_SHA: ${{ steps.range.outputs.head_sha }}
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
          APP_DEPENDENCIES_OUTCOME: ${{ steps.app-dependencies.outcome }}
          OBSERVATION_TOOLS_OUTCOME: ${{ steps.observation-tools.outcome }}
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
          BUILD_TEST_OUTCOME: ${{ steps.build-test.outcome }}
        shell: bash
        run: python .github/security/observe.py summarize

      - name: Upload observation evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: security-observation-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
